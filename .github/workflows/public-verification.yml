name: Public Verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*
      - android-v*
      - ios-v*
  workflow_dispatch:

concurrency:
  group: public-verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only superseded PR runs are cancelled. Every push to main and every tag
  # finishes, so each commit gets its debug APK and provenance attestation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flutter-android-debug:
    name: Test and build Android debug artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@e938fdf56512cc96ef2f93601a5a40bde3801046 # v2.19.0
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Install Android SDK packages
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_line="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "build_name=${version_line%%+*}" >> "$GITHUB_OUTPUT"
          echo "build_number=${version_line##*+}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build debug APK with source metadata
        env:
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >
          flutter build apk --debug
          --build-name "${BUILD_NAME}"
          --build-number "${BUILD_NUMBER}"
          --dart-define=DECOY_SOURCE_REPOSITORY=https://github.com/${SOURCE_REPOSITORY}
          --dart-define=DECOY_SOURCE_REF=${SOURCE_REF}
          --dart-define=DECOY_SOURCE_COMMIT=${SOURCE_COMMIT}
          --dart-define=DECOY_BUILD_CHANNEL=github-actions
          --dart-define=DECOY_BUILD_PLATFORM=android
          --dart-define=DECOY_BUILD_VERSION=${BUILD_NAME}
          --dart-define=DECOY_BUILD_NUMBER=${BUILD_NUMBER}
          --dart-define=DECOY_BUILD_VERIFICATION=public-debug-build

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decoy-wallet-public-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Attest debug APK provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: build/app/outputs/flutter-apk/app-debug.apk
