workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert           # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE
        - app_store_connect      # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import .p12
        script: |
          set -euo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile from env var
        script: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

      - name: Point Xcode project to installed profile(s)
        script: |
          set -euo pipefail
          xcode-project use-profiles --warn-only

      - name: Bump build number automatically
        script: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml || true
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA (Flutter)
        script: |
          set -euo pipefail
          flutter pub get
          # Build an ipa; Flutter should export to build/ios/ipa/
          flutter build ipa --release
          echo "Flutter build done. Printing any ipa hints from logs:"
          # This line prints the typical "Built IPA to:" hint if Flutter emitted it
          grep -i "Built .*ipa" -R build || true

      - name: Ensure an IPA exists (auto-package if Flutter didn’t export)
        script: |
          set -euo pipefail
          mkdir -p build/ios/ipa

          # 1) If an ipa already exists anywhere, use it.
          IPA_PATH="$(find build -type f -name '*.ipa' -print -quit || true)"
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            cp "$IPA_PATH" build/ios/ipa/ 2>/dev/null || true
            ls -lah build/ios/ipa
            exit 0
          fi

          echo "No .ipa found; attempting to package Runner.app from common locations…"

          # 2) Try to locate Runner.app in common Flutter/Xcode paths
          APP_PATH="$( \
            find build -type d -path '*/Runner.app' \
              \( -path '*/iphoneos/*' -o -path '*/Release-iphoneos/*' -o -path '*/Products/Applications/*' -o -path '*/Debug-iphoneos/*' \) \
              -print -quit || true \
          )"

          # If still not found, look anywhere under build as last resort
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find build -type d -name 'Runner.app' -print -quit || true)"
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found — Flutter build likely failed or output moved."
            echo "Directory snapshot for debugging:"
            find build -maxdepth 3 -mindepth 1 -type d -print | sed 's/^/  /'
            exit 1
          fi

          echo "Found Runner.app at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          (zip -qry Runner.zip Payload && mv Runner.zip build/ios/ipa/Runner.ipa)
          rm -rf Payload
          echo "Created IPA at build/ios/ipa/Runner.ipa"
          ls -lah build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/Runner*.ipa

    publishing:
      app_store_connect:
        # The validator requires FLAT (not nested) keys here
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
