workflows:
  ios_release:
    name: iOS Release
    max_build_duration: 60
    environment:
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Fetch signing files from App Store Connect
        script: |
          # Uses your env vars: APP_STORE_CONNECT_PRIVATE_KEY / KEY_IDENTIFIER / ISSUER_ID
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Install signing files
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          # Keep iOS and pubspec in sync with Codemagic build id
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          # Update the first 'version:' line in pubspec.yaml to 0.1.1+<CM_BUILD_ID>
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml || true

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # IMPORTANT: use these exact field names
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY        # base64 of the .p8 contents
        key_identifier: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        cancel_previous_submissions: true
