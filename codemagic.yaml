workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64)
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        TEAM_ID: 8Y7L4NZ5ZX
        # Set this in the UI:
        # IOS_PROFILE_SPECIFIER: mochakk-store-2025   # (name OR UUID)

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & deps
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      - name: Initialize keychain & import Distribution .p12
        script: |
          set -euxo pipefail
          : "${CM_CERTIFICATE:?Missing CM_CERTIFICATE}"
          : "${CM_CERTIFICATE_PASSWORD:?Missing CM_CERTIFICATE_PASSWORD}"
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning || true

      - name: Install App Store provisioning profile
        script: |
          set -euxo pipefail
          : "${IOS_PROVISIONING_PROFILE:?Missing IOS_PROVISIONING_PROFILE}"
          # purge any stale profiles so Xcode never picks an old one
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision || true
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          file "$PROFILE_PATH" || true
          xcode-project use-profiles --warn-only

      - name: Sanity: profile contains our imported cert
        script: |
          set -euxo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
          security cms -D -i "$PROFILE_PATH" -o /tmp/profile.plist
          # collect SHA-1s from the profile's DeveloperCertificates[]
          /usr/libexec/PlistBuddy -c 'Print :DeveloperCertificates' /tmp/profile.plist >/dev/null
          TMPDIR=$(mktemp -d)
          i=0; MATCHED=false
          while /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates:$i" /tmp/profile.plist >/dev/null 2>&1; do
            /usr/libexec/PlistBuddy -c "Print :DeveloperCertificates:$i" /tmp/profile.plist > "$TMPDIR/cert$i.der"
            FPR=$(openssl x509 -inform der -in "$TMPDIR/cert$i.der" -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':')
            if security find-identity -v -p codesigning | awk '{print $2}' | tr -d '"' | grep -qi "$FPR"; then
              MATCHED=true; break
            fi
            i=$((i+1))
          done
          $MATCHED || { echo "⚠️  The provisioning profile does NOT include the Distribution certificate imported from your .p12. Recreate the profile selecting the SAME Apple Distribution cert."; exit 1; }

      - name: Bump build number (UTC timestamp)
        script: |
          set -euxo pipefail
          BN="$(date -u +%Y%m%d%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$BN/" pubspec.yaml

      - name: Build IPA (Flutter)
        script: |
          set -euxo pipefail
          flutter build ipa --release || true
          ls -lah build/ios || true
          ls -lah build/ios/ipa || true
          ls -lah build/ios/archive || true

      - name: Ensure an IPA exists (fallback export from xcarchive)
        script: |
          set -euxo pipefail
          OUTDIR="build/ios/ipa"
          mkdir -p "$OUTDIR"
          IPA_FOUND="$(find build -type f -name '*.ipa' | head -n 1 || true)"
          if [ -z "$IPA_FOUND" ]; then
            ARCHIVE="$(ls -dt build/ios/archive/*.xcarchive 2>/dev/null | head -n 1 || true)"
            [ -n "$ARCHIVE" ] || { echo "No .xcarchive found — Flutter build likely failed."; exit 1; }

            # Use explicit specifier (name or UUID) — avoids parsing brittleness
            : "${IOS_PROFILE_SPECIFIER:?Set IOS_PROFILE_SPECIFIER to your profile NAME (e.g. mochakk-store-2025) or UUID}"
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              echo '  <key>method</key><string>app-store</string>'
              echo '  <key>signingStyle</key><string>manual</string>'
              echo "  <key>teamID</key><string>${TEAM_ID}</string>"
              echo '  <key>provisioningProfiles</key><dict>'
              echo "    <key>${BUNDLE_ID}</key><string>${IOS_PROFILE_SPECIFIER}</string>"
              echo '  </dict>'
              echo '  <key>manageAppVersionAndBuildNumber</key><false/>'
              echo '</dict></plist>'
            } > exportOptions.plist

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath "$OUTDIR" \
              -exportOptionsPlist exportOptions.plist
          fi

      - name: Verify IPA has embedded provisioning profile
        script: |
          set -euxo pipefail
          IPA="$(find build/ios/ipa -type f -name '*.ipa' | head -n 1)"
          unzip -l "$IPA" | grep -q 'embedded.mobileprovision'

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
