workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert           # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64 .mobileprovision)
        - app_store_connect      # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import .p12
        script: |
          set -euo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile from env var
        script: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          # Parse profile info (Name / UUID / Team) for later steps
          security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist || true)
          # Helpful diagnostics
          echo "Installed profile:"
          echo "  Name: $PROFILE_NAME"
          echo "  UUID: $PROFILE_UUID"
          echo "  Team: ${TEAM_ID:-unknown}"
          echo "  Path: $PROFILE_PATH"

          # Build an ExportOptions.plist that forces App Store export
          /usr/libexec/PlistBuddy -c "Add :method string app-store" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :destination string export" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" /tmp/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" /tmp/ExportOptions.plist
          if [ -n "${TEAM_ID:-}" ]; then
            /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" /tmp/ExportOptions.plist || true
          fi
          echo "ExportOptions.plist:"
          /usr/libexec/PlistBuddy -c "Print" /tmp/ExportOptions.plist

      - name: Point Xcode project to installed profile(s)
        script: |
          set -euo pipefail
          xcode-project use-profiles --warn-only

      - name: Bump build number automatically (numeric & App Store-safe)
        script: |
          set -euo pipefail
          BUILD_NUM="${CM_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          echo "Using build number: $BUILD_NUM"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$BUILD_NUM/" pubspec.yaml || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/Runner/Info.plist || true
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA (Flutter) with explicit export options (App Store)
        script: |
          set -euo pipefail
          flutter pub get
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
          grep -i "Built .*ipa" -R build || true

      - name: Verify IPA contains embedded.mobileprovision (App Store export)
        script: |
          set -euo pipefail
          IPA="$(find build -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA" ]; then
            echo "No IPA produced"; exit 1
          fi
          echo "Verifying IPA: $IPA"
          if unzip -l "$IPA" | grep -q "embedded.mobileprovision"; then
            echo "embedded.mobileprovision is present (OK)"
          else
            echo "WARNING: embedded.mobileprovision not found in IPA."
            echo "This often means a non–App Store export. Failing to avoid a bad upload."
            exit 1
          fi
          mkdir -p build/ios/ipa && cp "$IPA" build/ios/ipa/Runner.ipa
          ls -lah build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/Runner*.ipa

    publishing:
      app_store_connect:
        api_key:
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
