workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      flutter: stable
      xcode: latest
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # must contain: CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect     # must contain: APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import certificate
        script: |
          set -euo pipefail
          keychain initialize

          # Try Codemagic-managed certificates first.
          set +e
          keychain add-certificates
          RC=$?
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "No team-managed p12 found; importing from CM_CERTIFICATE…"
            CERT_PATH=/tmp/dist.p12
            echo "$CM_CERTIFICATE" | base64 --decode > "$CERT_PATH"
            # Codemagic prints the default keychain with leading spaces + quotes; trim them.
            KEYCHAIN_PATH=$(security default-keychain -d user | tr -d '" ' )
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CM_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          fi

          echo "Signing identities in keychain:"
          security find-identity -p codesigning -v || true

      - name: Fetch provisioning profile from App Store Connect
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Use downloaded profiles
        script: xcode-project use-profiles --warn-only

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA
        script: |
          set -euo pipefail
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # ✅ flat form the validator accepts
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY         # full .p8 INCLUDING BEGIN/END lines
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER       # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID         # UUID
        submit_to_testflight: true
