workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64)
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        TEAM_ID: 8Y7L4NZ5ZX     # your Apple Team ID

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean and get dependencies
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      - name: Initialize keychain and import p12
        script: |
          set -euxo pipefail
          : "${CM_CERTIFICATE:?Missing CM_CERTIFICATE}"
          : "${CM_CERTIFICATE_PASSWORD:?Missing CM_CERTIFICATE_PASSWORD}"
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning "$(security default-keychain -d user | tr -d '"')" || true

      - name: Install App Store provisioning profile
        script: |
          set -euxo pipefail
          : "${IOS_PROVISIONING_PROFILE:?Missing IOS_PROVISIONING_PROFILE}"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          xcode-project use-profiles --warn-only

      - name: Bump build number with UTC timestamp
        script: |
          set -euxo pipefail
          BN="$(date -u +%Y%m%d%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$BN/" pubspec.yaml
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/Runner/Info.plist || true

      - name: Build IPA using Flutter
        script: |
          set -euxo pipefail
          flutter build ipa --release || true
          ls -lah build/ios || true
          ls -lah build/ios/ipa || true
          ls -lah build/ios/archive || true

      - name: Ensure an IPA exists fallback export from xcarchive
        script: |
          set -euxo pipefail
          OUTDIR="build/ios/ipa"
          mkdir -p "$OUTDIR"
          IPA_FOUND="$(find build -type f -name '*.ipa' | head -n 1 || true)"
          if [ -z "$IPA_FOUND" ]; then
            echo "No .ipa from Flutter export. Trying xcodebuild -exportArchive..."
            ARCHIVE="$(ls -dt build/ios/archive/*.xcarchive 2>/dev/null | head -n 1 || true)"
            if [ -z "$ARCHIVE" ]; then
              echo "No .xcarchive found — Flutter build likely failed."
              find build -maxdepth 4 -print | sed 's/^/  /' | head -n 300 || true
              exit 1
            fi

            PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
            PROFILE_NAME="$(security cms -D -i "$PROFILE_PATH" | /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin)"

            cat > exportOptions.plist <<EOF
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>manual</string>
              <key>teamID</key><string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
              </dict>
              <key>manageAppVersionAndBuildNumber</key><false/>
            </dict>
            </plist>
            EOF

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE" \
              -exportPath "$OUTDIR" \
              -exportOptionsPlist exportOptions.plist
          fi
          ls -lah "$OUTDIR"

      - name: Verify IPA contains embedded provisioning profile
        script: |
          set -euxo pipefail
          IPA="$(find build/ios/ipa -type f -name '*.ipa' | head -n 1)"
          unzip -l "$IPA" | grep -q 'embedded.mobileprovision'

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
