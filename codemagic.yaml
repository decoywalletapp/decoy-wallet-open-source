workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert
        - app_store_connect
      xcode: latest
      vars:
        TEAM_ID: 8Y7L4NZ5ZX
        BUNDLE_ID: com.decoywalletapp.app
        EXT_BUNDLE_ID: com.decoywalletapp.app.ImageNotification
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $HOME/flutter
        - $HOME/.pub-cache
        - ios/Pods

    scripts:
      - name: Preflight env vars
        script: |
          set -euxo pipefail
          test -n "$CM_CERTIFICATE"
          test -n "$CM_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE"
          test -n "$EXT_IOS_PROVISIONING_PROFILE"
          test -n "$IOS_PROFILE_SPECIFIER"
          test -n "$EXT_IOS_PROFILE_SPECIFIER"
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"

      - name: Install Flutter (exact)
        script: |
          set -euxo pipefail
          if [ ! -d "$HOME/flutter/bin" ]; then
            cd "$HOME"
            URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.32.4-stable.zip"
            curl -L --fail --show-error --output flutter.zip "$URL"
            unzip -q flutter.zip
            rm -f flutter.zip
          fi
          echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $CM_ENV
          "$HOME/flutter/bin/flutter" --version

      - name: Show tool versions
        script: |
          set -euxo pipefail
          flutter --version
          xcodebuild -version
          cm version || true

      - name: Initialize keychain and import Distribution p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning

      - name: Install provisioning profiles (Runner and ImageNotification)
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          echo "$EXT_IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/ext_appstore.mobileprovision"

          /usr/bin/security cms -D -i "$PROFILE_DIR/appstore.mobileprovision" > /tmp/profile_app.plist
          /usr/bin/security cms -D -i "$PROFILE_DIR/ext_appstore.mobileprovision" > /tmp/profile_ext.plist

          echo "App profile name:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_app.plist
          echo "App profile app id:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_app.plist

          echo "Ext profile name:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_ext.plist
          echo "Ext profile app id:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_ext.plist

      - name: Create exportOptions.plist (manual signing)
        script: |
          set -euxo pipefail
          plist=exportOptions.plist
          rm -f "$plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$plist"

          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_SPECIFIER" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$EXT_BUNDLE_ID string $EXT_IOS_PROFILE_SPECIFIER" "$plist"

          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" "$plist"
          /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" "$plist"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$plist"

          /usr/libexec/PlistBuddy -c "Print" "$plist"

      - name: Force build number (UTC timestamp) and set export compliance flag
        script: |
          set -euxo pipefail
          BN="$(date -u +%Y%m%d%H%M)"

          echo "BN=$BN" >> $CM_ENV

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist || true

          perl -i -pe "s/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+\d+)?/version: \${1}+$BN/m" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist

      - name: Apply provisioning profiles to Xcode project
        script: |
          set -euxo pipefail
          xcode-project use-profiles --warn-only

      - name: Clean and build archive
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          flutter build ipa --release --build-number "$BN" --export-options-plist exportOptions.plist

      - name: Verify IPA exists
        script: |
          set -euxo pipefail
          ls -lah build/ios/ipa || true
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          test -n "$IPA"
          echo "IPA ready: $IPA"

      - name: Upload to App Store Connect (CLI)
        script: |
          set -euxo pipefail
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

    artifacts:
      - build/ios/ipa/*.ipa
      - exportOptions.plist
