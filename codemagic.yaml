workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      flutter: stable
      xcode: latest
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build iOS app (no codesign)
        script: |
          set -euxo pipefail
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        APPLE_TEAM_ID: 8Y7L4NZ5ZX
        # Required env vars in Codemagic:
        #   APP_STORE_CONNECT_PRIVATE_KEY   (full .p8 incl. BEGIN/END)
        #   APP_STORE_CONNECT_KEY_IDENTIFIER
        #   APP_STORE_CONNECT_ISSUER_ID
        #   CM_CERTIFICATE                  (base64 of Apple Distribution .p12)
        #   CM_CERTIFICATE_PASSWORD         (password used when exporting .p12)
        #   CM_PROVISIONING_PROFILE         (base64 of App Store .mobileprovision)
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import Distribution .p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning "$(security default-keychain -d user | tr -d '\"' | xargs)" || true

      - name: Install App Store provisioning profile
        script: |
          set -euxo pipefail
          TMP_PP=/tmp/appstore.mobileprovision
          echo "$CM_PROVISIONING_PROFILE" | base64 --decode > "$TMP_PP"

          PP_PLIST=/tmp/profile.plist
          security cms -D -i "$TMP_PP" -o "$PP_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PP_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PP_PLIST")
          echo "PROFILE_UUID=$PROFILE_UUID"
          echo "PROFILE_NAME=$PROFILE_NAME"

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp "$TMP_PP" "$PP_DIR/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_UUID=$PROFILE_UUID" >> "$CM_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$CM_ENV"

          xcode-project use-profiles --warn-only

      - name: Bump build number (numeric & monotonic)
        script: |
          set -euxo pipefail
          BN="${CM_BUILD_NUMBER:-$(date -u +%Y%m%d%H%M)}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$BN/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/Runner/Info.plist

      - name: "Archive & export signed IPA with Xcode (recommended: no extra keychain flags)"
        script: |
          set -euxo pipefail

          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcode-project build-ipa \
            --workspace "$IOS_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_IDENTITY=Apple\\ Distribution PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" \
            --export-options exportOptions.plist

          echo "IPAs in build/ios/ipa:"
          ls -lah build/ios/ipa || true

      - name: Verify IPA contains embedded.mobileprovision
        script: |
          set -euxo pipefail
          IPA="$(/bin/ls -1 build/ios/ipa/*.ipa | head -n 1)"
          unzip -l "$IPA" | grep -q embedded.mobileprovision

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.dSYM.zip

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
