workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          rm -f Podfile.lock
          pod install
          cd ..
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Initialize keychain & import signing certificate
        script: |
          # decode the p12 from env var and import it
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain initialize
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Fetch provisioning profile from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --api-key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --api-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/version:/s/version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # flat syntax the validator requires
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY      # whole .p8, WITH -----BEGIN/END----- lines
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER     # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID       # UUID
        submit_to_testflight: true
