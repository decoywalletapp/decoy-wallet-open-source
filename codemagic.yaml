workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert
        - app_store_connect
      xcode: latest
      vars:
        TEAM_ID: 8Y7L4NZ5ZX
        BUNDLE_ID: com.decoywalletapp.app
        EXT_BUNDLE_ID: com.decoywalletapp.app.ImageNotification
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        FLUTTER_VERSION: 3.32.4

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods

    scripts:

      - name: Install Flutter (exact)
        script: |
          set -euxo pipefail
          if [ ! -d "$HOME/flutter" ]; then
            cd "$HOME"
            curl -L -o flutter.zip https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip
            unzip -q flutter.zip
            rm flutter.zip
          fi
          echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $CM_ENV
          flutter --version

      - name: Show tool versions
        script: |
          set -euxo pipefail
          flutter --version
          xcodebuild -version

      - name: Initialize keychain and import Distribution p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates \
            --certificate /tmp/dist.p12 \
            --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning

      - name: Install provisioning profiles (Runner + ImageNotification)
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/app.mobileprovision"
          echo "$EXT_IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/ext.mobileprovision"

          ls -lah "$PROFILE_DIR"

      - name: Create exportOptions.plist
        script: |
          set -euxo pipefail
          plist=exportOptions.plist
          rm -f "$plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$plist"

          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_SPECIFIER" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$EXT_BUNDLE_ID string $EXT_IOS_PROFILE_SPECIFIER" "$plist"

          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$plist"
          /usr/libexec/PlistBuddy -c "Print" "$plist"

      - name: Apply provisioning profiles to Xcode project
        script: |
          set -euxo pipefail
          xcode-project use-profiles --warn-only

      - name: Clean and build archive
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=$TEAM_ID

      - name: Export IPA
        script: |
          set -euxo pipefail
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ios/ipa

          ls -lah build/ios/ipa

      - name: Upload to App Store Connect
        script: |
          set -euxo pipefail
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

    artifacts:
      - build/ios/ipa/*.ipa
