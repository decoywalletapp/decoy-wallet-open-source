workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      flutter: stable
      xcode: latest
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build iOS app (no codesign)
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert         # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - provisioning         # IOS_PROVISIONING_PROFILE
        - asc_api              # APP_STORE_CONNECT_* vars
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & restore dependencies
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      - name: Initialize keychain & import .p12
        script: |
          set -euo pipefail
          # Creates a temporary keychain and imports the .p12 from CM_CERTIFICATE
          keychain initialize
          keychain add-certificates
          echo "== Identities =="
          security find-identity -v -p codesigning || true

      - name: Install provisioning profile from env var
        script: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          ls -l "$PROFILE_DIR"

      - name: Point Xcode project to installed profile(s)
        script: |
          set -euo pipefail
          xcode-project use-profiles --warn-only

      - name: Bump build number automatically
        script: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          # Also align pubspec build number so App Store bundle version is unique
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA
        script: |
          set -euo pipefail
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY     # FULL .p8 content incl. headers
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER   # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID     # UUID from App Store Connect
        submit_to_testflight: true
