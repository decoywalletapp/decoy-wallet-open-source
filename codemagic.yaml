workflows:
  ios_release:
    name: iOS release
    max_build_duration: 120

    environment:
      groups:
        - app_store_connect        # <-- imports the three secrets you created
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: 16.4
      cocoapods: default

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Install signing files
        script: |
          keychain add-certificates
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          # Keep iOS CFBundleVersion unique using Codemagic's build ID
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          # Keep pubspec in sync (0.1.1+<build>)
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # USE API KEY AUTH (not Apple ID/password)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY        # contents of the .p8
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER      # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID        # the long UUID
        submit_to_testflight: true
        cancel_previous_submissions: true
