workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert
        - app_store_connect
      xcode: latest
      vars:
        TEAM_ID: 8Y7L4NZ5ZX
        APP_BUNDLE_ID: com.decoywalletapp.app
        EXT_BUNDLE_ID: com.decoywalletapp.app.ImageNotification
        FLUTTER_VERSION: 3.32.4

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods

    scripts:
      - name: Install Flutter (exact)
        script: |
          set -euxo pipefail
          WANT="${FLUTTER_VERSION}"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${WANT}-stable.zip"

          if [ -d "$HOME/flutter" ]; then
            have="$($HOME/flutter/bin/flutter --version | head -n1 | awk '{print $2}')"
            if [ "$have" != "$WANT" ]; then
              rm -rf "$HOME/flutter"
            fi
          fi

          if [ ! -x "$HOME/flutter/bin/flutter" ]; then
            cd "$HOME"
            rm -f flutter.zip
            curl -L --fail --show-error --output flutter.zip "$URL"
            unzip -q flutter.zip
            rm -f flutter.zip
          fi

          echo 'export PATH="$HOME/flutter/bin:$PATH"' >> "$CM_ENV"
          flutter --version

      - name: Initialize keychain and import p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning || true

      - name: Install provisioning profiles (Runner + ImageNotification)
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/runner.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_IMAGE_NOTIFICATION" | base64 --decode > "$PROFILE_DIR/imagenotification.mobileprovision"

          for f in "$PROFILE_DIR/runner.mobileprovision" "$PROFILE_DIR/imagenotification.mobileprovision"; do
            /usr/bin/security cms -D -i "$f" > /tmp/profile.plist
            echo "Profile file: $f"
            /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist
            /usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist
            /usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" /tmp/profile.plist
            /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist
            /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/profile.plist || true
            echo ""
          done

      - name: Create exportOptions.plist (manual signing)
        script: |
          set -euxo pipefail
          plist=exportOptions.plist
          rm -f "$plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$APP_BUNDLE_ID string $IOS_PROFILE_SPECIFIER" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$EXT_BUNDLE_ID string $IOS_PROFILE_SPECIFIER_IMAGE_NOTIFICATION" "$plist"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$plist"

          /usr/libexec/PlistBuddy -c "Print" "$plist"

      - name: Bump build number (UTC timestamp)
        script: |
          set -euxo pipefail
          BN="$(date -u +%Y%m%d%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist
          perl -i -pe "s/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+\d+)?/version: \${1}+$BN/m" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Set encryption flag in Info.plist
        script: |
          set -euxo pipefail
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist

      - name: Apply profiles to Xcode project
        script: |
          set -euxo pipefail
          xcode-project use-profiles --warn-only

      - name: Build iOS (no codesign) and archive with Xcode
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign

          mkdir -p build/ios/archive

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual

      - name: Export IPA from xcarchive
        script: |
          set -euxo pipefail
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ios/ipa

          echo "Export outputs:"
          ls -lah build/ios/ipa || true
          find build/ios/ipa -maxdepth 2 -type f -name '*.ipa' -print

      - name: Upload to App Store Connect (CLI)
        script: |
          set -euxo pipefail
          IPA="$(find build/ios/ipa -maxdepth 2 -type f -name '*.ipa' | head -n 1)"
          test -n "$IPA"

          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
