workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      flutter: stable
      xcode: latest
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - app_store_connect        # must exist with 3 vars
        # (APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID)
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import certificates (Codemagic-managed)
        script: |
          set -euo pipefail
          keychain initialize
          keychain add-certificates

      - name: Fetch provisioning profile from App Store Connect
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Use downloaded profiles
        script: |
          xcode-project use-profiles --warn-only

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA
        script: |
          set -euo pipefail
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY     # FULL .p8 value incl. BEGIN/END lines
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER   # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID     # UUID
        submit_to_testflight: true
