workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        # Leave only what you actually use. This group holds your App Store Connect API key vars.
        - app_store_connect   # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          set -e
          flutter clean
          flutter pub get

      - name: Initialize keychain & import signing certificate
        script: |
          set -euxo pipefail
          # Create an ephemeral keychain and import ANY .p12 files you uploaded in
          # Repository settings → Code signing files → iOS certificates.
          keychain initialize
          keychain add-certificates

      - name: Install CocoaPods
        script: |
          set -e
          cd ios
          pod install --repo-update
          cd ..

      - name: Use provisioning profiles
        script: |
          set -e
          # This installs ANY .mobileprovision you uploaded in Repository settings → Code signing files.
          xcode-project use-profiles

      - name: Bump build numbers
        script: |
          set -e
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          # Keep Flutter & iOS in sync
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n "^version:" pubspec.yaml

      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        # Uses your API key to upload to TestFlight (does NOT create signing files)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY      # full .p8 contents with header/footer
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER    # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID      # the long UUID
        submit_to_testflight: true
