workflows:
  ios_compile_only:
    name: iOS compile check (no codesign)
    environment:
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..
      - name: Initialize keychain & import signing certificate
        script: |
          keychain initialize
          KEYCHAIN_PATH=$(security default-keychain -d user | tr -d '"')
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN_PATH" -P "$CM_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
      - name: Fetch provisioning profile from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" --create
          xcode-project use-profiles
      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/version:/s/version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        # <-- flat syntax (what the validator wants)
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY        # full .p8 contents with headers
        key_id:  $APP_STORE_CONNECT_KEY_IDENTIFIER     # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID        # the long UUID
        submit_to_testflight: true
        cancel_previous_submissions: false
