workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      flutter: stable
      xcode: latest
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..
      - name: Build iOS app (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert         # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect    # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import p12
        script: |
          set -euo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          # Import the distribution p12 + password into the default Codemagic keychain
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Debug: show available code signing identities
        script: |
          set -euo pipefail
          KEYCHAIN=$(security default-keychain -d user | tr -d '" ')
          echo "Default keychain: $KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" || true

      - name: Fetch provisioning profile from App Store Connect
        script: |
          set -euo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Use downloaded profiles
        script: xcode-project use-profiles --warn-only

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA
        script: flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY       # full .p8 (BEGIN/END lines)
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER     # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID       # UUID
        submit_to_testflight: true
