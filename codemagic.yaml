workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD, and one of IOS_PROVISIONING_PROFILE / IOS_PROVISIONING_PROFILE_SECRET / iOSProvisioningProfileSecret (base64 .mobileprovision)
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY (full .p8 incl BEGIN/END), APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        APPLE_TEAM_ID: 8Y7L4NZ5ZX

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & restore dependencies
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      - name: Initialize keychain & import Distribution .p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$(security default-keychain -d user | tr -d '"')"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$CM_ENV"
          echo "Codesign identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      - name: Install App Store provisioning profile from env var
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          # Accept any of the 3 possible variable names you might be using
          if [ -n "${IOS_PROVISIONING_PROFILE:-}" ]; then
            echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          elif [ -n "${IOS_PROVISIONING_PROFILE_SECRET:-}" ]; then
            echo "$IOS_PROVISIONING_PROFILE_SECRET" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          elif [ -n "${iOSProvisioningProfileSecret:-}" ]; then
            echo "$iOSProvisioningProfileSecret" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          else
            echo "No provisioning profile env var found"; exit 1
          fi

          PROFILE_PATH="$PROFILE_DIR/appstore.mobileprovision"

          # Extract Name + UUID from the profile (we will use UUID to avoid name mismatches)
          PLIST="$(security cms -D -i "$PROFILE_PATH")"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PLIST")

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$CM_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$CM_ENV"
          echo "Using profile: $PROFILE_NAME ($PROFILE_UUID)"

          # Create ExportOptions.plist that explicitly maps your bundle id to the profile NAME
          # (Xcode needs the name here, but we will pass UUID as the build specifier)
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadBitcode</key><false/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          EOF

      - name: Bump build number (UTC timestamp)
        script: |
          set -euxo pipefail
          TS=$(date -u +"%Y%m%d%H%M")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TS" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$TS/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build iOS app (no codesign via Flutter)
        script: |
          set -euxo pipefail
          flutter build ios --release --no-codesign

      - name: Archive & export signed IPA with Xcode (use UUID as specifier)
        script: |
          set -euxo pipefail
          # Use UUID to avoid profile-name typos; also force Manual + Distribution identity.
          xcode-project build-ipa \
            --workspace "$IOS_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_IDENTITY=Apple\ Distribution PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID OTHER_CODE_SIGN_FLAGS=--keychain\ $KEYCHAIN_PATH" \
            --export-options exportOptions.plist

          echo "IPAs in build/ios/ipa:"
          ls -lah build/ios/ipa || true

      - name: Verify IPA contains embedded.mobileprovision
        script: |
          set -euxo pipefail
          IPA="build/ios/ipa/Runner.ipa"
          if unzip -Z1 "$IPA" '*/embedded.mobileprovision' >/dev/null 2>&1; then
            echo "embedded.mobileprovision present ✅"
          else
            echo "embedded.mobileprovision missing ❌"; exit 1
          fi

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
