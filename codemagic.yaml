workflows:
  ios_release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store_connect      # uses APP_STORE_CONNECT_* vars (already created)
        - signing_cert           # uses CM_CERTIFICATE & CM_CERTIFICATE_PASSWORD
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      xcode: latest
      cocoapods: default
      flutter: stable

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Initialize keychain & import signing certificate
        script: |
          # Create Codemagic keychain & unlock it
          keychain initialize
          # Decode the base64 .p12 from env and import with its password
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --password "$CM_CERTIFICATE_PASSWORD"

      - name: Fetch provisioning profile from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          # Apply downloaded profiles to the Xcode project
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          # Keep iOS CFBundleVersion in sync with Codemagic build id
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          # And set Flutter build number to the same
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # If you later want App Store review submission, add:
        # submit_to_app_store: true
        # And only then you may use cancel_previous_submissions: true
