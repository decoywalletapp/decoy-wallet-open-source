workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert
        - app_store_connect
      xcode: 26.2
      vars:
        TEAM_ID: 8Y7L4NZ5ZX
        BUNDLE_ID: com.decoywalletapp.app
        EXT_BUNDLE_ID: com.decoywalletapp.app.ImageNotification
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods

    scripts:
      - name: Preflight env vars
        script: |
          set -euxo pipefail
          test -n "$CM_CERTIFICATE"
          test -n "$CM_CERTIFICATE_PASSWORD"
          test -n "$IOS_PROVISIONING_PROFILE"
          test -n "$EXT_IOS_PROVISIONING_PROFILE"
          test -n "$IOS_PROFILE_SPECIFIER"
          test -n "$EXT_IOS_PROFILE_SPECIFIER"
          test -n "$APP_STORE_CONNECT_KEY_IDENTIFIER"
          test -n "$APP_STORE_CONNECT_ISSUER_ID"
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY"

      - name: Install Flutter 3.38.5 to match known-good build
        script: |
          set -euxo pipefail
          rm -rf "$HOME/flutter" "$HOME/flutter.zip"
          cd "$HOME"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_3.38.5-stable.zip"
          curl -L --fail --show-error --output flutter.zip "$URL"
          unzip -q flutter.zip
          rm -f flutter.zip
          echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $CM_ENV
          "$HOME/flutter/bin/flutter" --version

      - name: Show tool versions
        script: |
          set -euxo pipefail
          flutter --version
          xcodebuild -version
          cm version || true

      - name: Initialize keychain and import Distribution p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning

      - name: Install provisioning profiles
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          echo "$EXT_IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/ext_appstore.mobileprovision"

          /usr/bin/security cms -D -i "$PROFILE_DIR/appstore.mobileprovision" > /tmp/profile_app.plist
          /usr/bin/security cms -D -i "$PROFILE_DIR/ext_appstore.mobileprovision" > /tmp/profile_ext.plist

          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_app.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_app.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/profile_app.plist || true

          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_ext.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_ext.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/profile_ext.plist || true

      - name: Create exportOptions.plist
        script: |
          set -euxo pipefail
          plist=exportOptions.plist
          rm -f "$plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_SPECIFIER" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$EXT_BUNDLE_ID string $EXT_IOS_PROFILE_SPECIFIER" "$plist"
          /usr/libexec/PlistBuddy -c "Add :compileBitcode bool false" "$plist"
          /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" "$plist"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$plist"
          /usr/libexec/PlistBuddy -c "Print" "$plist"

      - name: Force build number and set export compliance flag
        script: |
          set -euxo pipefail
          BN="$(date -u +%Y%m%d%H%M)"
          echo "BN=$BN" >> $CM_ENV

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist || true
          perl -i -pe "s/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)(?:\+\d+)?/version: \${1}+$BN/m" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool NO" ios/Runner/Info.plist

      - name: Stabilize generated FlutterFlow code
        script: |
          set -euxo pipefail

          if [ -d lib/duress_mode ]; then
            find lib/duress_mode -name '*_widget.dart' -print0 | \
              xargs -0 perl -0pi -e 's/backgroundColor: Color\(0x001D2428\)/backgroundColor: Color(0xFF000000)/g'
          fi

          if [ -f lib/pin_pages/create_decoy_pin/create_decoy_pin_widget.dart ]; then
            perl -0pi -e 's/backgroundColor: Color\(0x001D2428\)/backgroundColor: Color(0xFF000000)/g' \
              lib/pin_pages/create_decoy_pin/create_decoy_pin_widget.dart
          fi

          if [ -f lib/welcom_pages/phone_number_verification/phone_number_verification_widget.dart ]; then
            perl -0pi -e 's/(textAlign:\n\s+TextAlign\.center,\n)(\s+cursorColor:)/$1                                                      keyboardType: TextInputType.number,\n                                                      autofillHints: [\n                                                        AutofillHints.oneTimeCode\n                                                      ],\n$2/' \
              lib/welcom_pages/phone_number_verification/phone_number_verification_widget.dart
          fi

          if [ -f lib/emergancy_contact_information/home_address_entry_page/home_address_entry_page_widget.dart ]; then
            perl -0pi -e 's/(controller:\n\s+_model\.zipTextController,\n\s+focusNode: _model\.zipFocusNode,\n\s+autofocus: false,\n\s+autofillHints: \[\n\s+)AutofillHints\.email/$1AutofillHints.postalCode/' \
              lib/emergancy_contact_information/home_address_entry_page/home_address_entry_page_widget.dart
          fi

          perl -0pi -e 's/AutofillHints\.password/AutofillHints.newPassword/g' \
            lib/welcom_pages/create_account/create_account_widget.dart \
            lib/welcom_pages/update_password_page/update_password_page_widget.dart || true

          /usr/bin/python3 scripts/codemagic_generated_field_fixes.py

          test -f ios/Runner/Runner.entitlements
          grep -q "aps-environment" ios/Runner/Runner.entitlements
          grep -q "com.apple.developer.applesignin" ios/Runner/Runner.entitlements
          grep -q "shouldSeedFakeBtcBalance" lib/app_state.dart

          if grep -R "backgroundColor: Color(0x001D2428)" lib/duress_mode; then
            echo "Transparent duress page backgrounds remain."
            exit 1
          fi

      - name: Apply provisioning profiles to Xcode project
        script: |
          set -euxo pipefail
          xcode-project use-profiles --warn-only

      - name: Clean and build archive
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          flutter build ipa --release --build-number "$BN" --export-options-plist exportOptions.plist

      - name: Verify IPA exists
        script: |
          set -euxo pipefail
          ls -lah build/ios/ipa || true
          IPA_REL="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          test -n "$IPA_REL"
          IPA_ABS="$(/usr/bin/python3 -c 'import os,sys; print(os.path.abspath(sys.argv[1]))' "$IPA_REL")"
          echo "IPA_REL=$IPA_REL" >> $CM_ENV
          echo "IPA_ABS=$IPA_ABS" >> $CM_ENV
          echo "IPA ready: $IPA_ABS"

      - name: Inspect embedded.mobileprovision
        script: |
          set -euxo pipefail
          IPA="${IPA_ABS:-}"
          test -n "$IPA"
          test -f "$IPA"

          rm -rf /tmp/ipa_inspect
          mkdir -p /tmp/ipa_inspect
          unzip -p "$IPA" 'Payload/*.app/embedded.mobileprovision' > /tmp/ipa_inspect/embedded.mobileprovision
          /usr/bin/security cms -D -i /tmp/ipa_inspect/embedded.mobileprovision > /tmp/ipa_inspect/embedded.plist
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/ipa_inspect/embedded.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/ipa_inspect/embedded.plist
          /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" /tmp/ipa_inspect/embedded.plist || true

      - name: Upload to App Store Connect
        script: |
          set -euxo pipefail
          IPA="${IPA_ABS:-}"
          test -n "$IPA"
          test -f "$IPA"

          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

    artifacts:
      - build/ios/ipa/*.ipa
      - exportOptions.plist
