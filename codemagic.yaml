workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          cd ios && pod install --repo-update && cd -
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          rm -rf ios/Pods ios/Podfile.lock
          flutter pub get
          cd ios && pod install --repo-update && cd -
      - name: Initialize keychain & import signing certificate
        script: |
          set -euo pipefail
          # Create and make default the ephemeral build keychain
          keychain initialize
          keychain set-timeout 3600
          keychain make-default

          # Decode your Base64-encoded .p12 from CM_CERTIFICATE
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12

          # Import it into the active keychain with the password
          KEYCHAIN_PATH="$(keychain get-default | tail -n1)"
          security import /tmp/dist.p12 -k "$KEYCHAIN_PATH" -P "$CM_CERTIFICATE_PASSWORD" -A

          # (Optional) show that a signing identity is now present
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
      - name: Use provisioning profiles stored in Codemagic
        script: |
          # This maps the profiles you uploaded under Teams ➜ iOS provisioning profiles
          xcode-project use-profiles --warn-only
      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key:
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          private_key: $APP_STORE_CONNECT_PRIVATE_KEY   # full .p8 contents WITH headers
        submit_to_testflight: true
