workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert        # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect   # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Initialize keychain & import signing certificate
        script: |
          # Create & unlock a temporary keychain for the build
          keychain initialize

          # Write the distribution .p12 to the location expected by 'keychain add-certificates'
          mkdir -p "$HOME/Library/MobileDevice/Certificates"
          echo "$CM_CERTIFICATE" | base64 --decode > "$HOME/Library/MobileDevice/Certificates/dist.p12"

          # Import into the build keychain
          keychain add-certificates

          # If for any reason the helper didn't import, fallback to a direct security import
          if ! security find-identity -p codesigning -v | grep -q "Apple Distribution"; then
            KEYCHAIN_PATH=$(security default-keychain | tr -d '"' | xargs)   # trim quotes/whitespace
            security import "$HOME/Library/MobileDevice/Certificates/dist.p12" \
              -k "$KEYCHAIN_PATH" -P "$CM_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/security
          fi

          # Show what we have
          security find-identity -p codesigning -v || true

      - name: Apply provisioning profiles
        script: |
          # Uses the profiles you added in Teams -> iOS provisioning profiles
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key:
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        cancel_previous_submissions: false
