workflows:
  ios_compile_check:
    name: iOS Compile Check (no codesign)
    environment:
      flutter: stable
      xcode: latest
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods
    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get
      - name: Build iOS app (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app

  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - app_store_connect   # APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      # This imports ANY .p12 you uploaded under Team → iOS code signing → iOS certificates
      - name: Initialize keychain & import certificates (Codemagic-managed)
        script: |
          set -euxo pipefail
          keychain initialize
          keychain add-certificates
          echo "---- Codesign identities ----"
          security find-identity -v -p codesigning || true

      # This fetches the App Store profile if needed (optional if you uploaded it),
      # and then APPLIES the profile(s) to the Xcode project so signing is MANUAL.
      - name: Fetch / apply provisioning profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create || true

          xcode-project use-profiles

      # Bump build number so App Store Connect accepts the upload
      - name: Bump build number to Codemagic build id
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*$/s//version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      # Build and export IPA using Xcode with the applied profiles (most robust path)
      - name: Build IPA (Xcode)
        script: |
          # Generate updated Xcode project with Flutter first (no codesign)
          flutter build ios --release --no-codesign
          # Archive & export using the provisioning profiles that were applied
          xcode-project build-ipa --workspace "$IOS_WORKSPACE" --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY   # full .p8 INCLUDING BEGIN/END lines
        submit_to_testflight: true
