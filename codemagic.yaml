workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert           # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE
        - app_store_connect      # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Initialize keychain & import .p12
        script: |
          set -euo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile from env var
        script: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

      - name: Point Xcode project to installed profile(s)
        script: |
          set -euo pipefail
          xcode-project use-profiles --warn-only

      - name: Bump build number automatically (numeric & App Store-safe)
        script: |
          set -euo pipefail
          # Use Codemagic's integer if available, otherwise a timestamp
          BUILD_NUM="${CM_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}"
          echo "Using build number: $BUILD_NUM"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" ios/Runner/Info.plist
          # Keep marketing version; only bump the build metadata in pubspec
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$BUILD_NUM/" pubspec.yaml || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/Runner/Info.plist || true
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA (Flutter)
        script: |
          set -euo pipefail
          flutter pub get
          flutter build ipa --release
          grep -i "Built .*ipa" -R build || true

      - name: Ensure an IPA exists (auto-package if Flutter didn’t export)
        script: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          IPA_PATH="$(find build -type f -name '*.ipa' -print -quit || true)"
          if [ -n "$IPA_PATH" ]; then
            echo "Found IPA at: $IPA_PATH"
            cp "$IPA_PATH" build/ios/ipa/ 2>/dev/null || true
            ls -lah build/ios/ipa
            exit 0
          fi
          echo "No .ipa found; attempting to package Runner.app…"
          APP_PATH="$(find build -type d -path '*/Runner.app' \
                      \( -path '*/iphoneos/*' -o -path '*/Release-iphoneos/*' -o -path '*/Products/Applications/*' -o -path '*/Debug-iphoneos/*' \) \
                      -print -quit || true)"
          [ -z "$APP_PATH" ] && APP_PATH="$(find build -type d -name 'Runner.app' -print -quit || true)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Runner.app not found — Flutter build likely failed."
            find build -maxdepth 3 -mindepth 1 -type d -print | sed 's/^/  /'
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          (zip -qry Runner.zip Payload && mv Runner.zip build/ios/ipa/Runner.ipa)
          rm -rf Payload
          echo "Created IPA at build/ios/ipa/Runner.ipa"
          ls -lah build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/Runner*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
