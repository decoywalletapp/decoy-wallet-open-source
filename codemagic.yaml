workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert
        - app_store_connect
      xcode: latest
      vars:
        TEAM_ID: 8Y7L4NZ5ZX
        BUNDLE_ID: com.decoywalletapp.app
        EXT_BUNDLE_ID: com.decoywalletapp.app.ImageNotification
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        FLUTTER_VERSION: 3.32.4

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods

    scripts:
      - name: Install Flutter (exact)
        script: |
          set -euxo pipefail

          WANT="${FLUTTER_VERSION}"
          URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${WANT}-stable.zip"

          need_install="1"
          if [ -x "$HOME/flutter/bin/flutter" ]; then
            have="$($HOME/flutter/bin/flutter --version | head -n1 | awk '{print $2}')"
            if [ "$have" = "$WANT" ]; then
              need_install="0"
            else
              rm -rf "$HOME/flutter"
            fi
          fi

          if [ "$need_install" = "1" ]; then
            cd "$HOME"
            rm -f flutter.zip
            for i in $(seq 1 10); do
              curl -L --fail --show-error --continue-at - --output flutter.zip "$URL" && break || sleep $((i*5))
            done
            unzip -q flutter.zip
            rm -f flutter.zip
          fi

          echo 'export PATH="$HOME/flutter/bin:$PATH"' >> $CM_ENV
          flutter --version

      - name: Show tool versions
        script: |
          set -euxo pipefail
          flutter --version
          xcodebuild -version

      - name: Preflight env vars
        script: |
          set -euxo pipefail
          test -n "${CM_CERTIFICATE}"
          test -n "${CM_CERTIFICATE_PASSWORD}"
          test -n "${IOS_PROVISIONING_PROFILE}"
          test -n "${EXT_IOS_PROVISIONING_PROFILE}"
          test -n "${IOS_PROFILE_SPECIFIER}"
          test -n "${EXT_IOS_PROFILE_SPECIFIER}"
          echo "Env vars present."

      - name: Initialize keychain and import p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          security find-identity -v -p codesigning

      - name: Install provisioning profiles (Runner and ImageNotification)
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"

          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/runner_appstore.mobileprovision"
          echo "$EXT_IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/imagenotification_appstore.mobileprovision"

          /usr/bin/security cms -D -i "$PROFILE_DIR/runner_appstore.mobileprovision" > /tmp/profile_runner.plist
          /usr/bin/security cms -D -i "$PROFILE_DIR/imagenotification_appstore.mobileprovision" > /tmp/profile_ext.plist

          echo "Runner profile name:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_runner.plist
          echo "Runner app id:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_runner.plist

          echo "Extension profile name:"
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile_ext.plist
          echo "Extension app id:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile_ext.plist

      - name: Create exportOptions.plist (manual signing)
        script: |
          set -euxo pipefail
          plist=exportOptions.plist
          rm -f "$plist"

          /usr/libexec/PlistBuddy -c "Add :method string app-store" "$plist"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$plist"

          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_SPECIFIER" "$plist"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$EXT_BUNDLE_ID string $EXT_IOS_PROFILE_SPECIFIER" "$plist"

          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool false" "$plist"
          /usr/libexec/PlistBuddy -c "Print" "$plist"

      - name: Apply provisioning profiles to Xcode project
        script: |
          set -euxo pipefail
          xcode-project use-profiles --warn-only

      - name: Build IPA (Flutter)
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          flutter build ipa --release --export-options-plist exportOptions.plist

      - name: Upload to App Store Connect (CLI)
        script: |
          set -euxo pipefail
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          test -n "$IPA"
          app-store-connect publish \
            --path "$IPA" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --private-key @env:APP_STORE_CONNECT_PRIVATE_KEY

    artifacts:
      - build/ios/ipa/*.ipa
