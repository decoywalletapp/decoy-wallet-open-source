workflows:
  ios_release:
    name: iOS Release (TestFlight)
    instance_type: mac_mini_m2

    environment:
      groups:
        - app_store_connect        # APP_STORE_CONNECT_PRIVATE_KEY, ..._KEY_IDENTIFIER, ..._ISSUER_ID
        - signing_cert            # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      xcode: latest
      cocoapods: default
      flutter: stable

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Initialize keychain & import signing certificate
        script: |
          set -euo pipefail

          # Create & unlock Codemagic keychain
          keychain initialize

          # Decode the base64-encoded .p12 from env into a temp file
          P12=/tmp/dist.p12
          echo "$CM_CERTIFICATE" | base64 --decode > "$P12"

          # Get the actual default keychain path (strip quotes/whitespace)
          KEYCHAIN_PATH=$(security default-keychain | tr -d '"' | xargs)

          # Import the .p12 into that keychain using its password
          security import "$P12" \
            -k "$KEYCHAIN_PATH" \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Allow codesign to access the key non-interactively
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Fetch provisioning profile from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          sed -i '' -E "1,/^version:/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
