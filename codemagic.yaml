workflows:
  ios_release:
    name: iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      groups:
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
        - signing_cert          # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          set -euxo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -euxo pipefail
          cd ios
          pod install --repo-update
          cd ..

      # 🔑 1) Initialize keychain and import your .p12 (private key)
      - name: Initialize keychain & import signing certificate
        script: |
          set -euxo pipefail
          keychain initialize
          keychain add-certificates
          # Quick visibility
          security find-identity -v -p codesigning || true

      # 📄 2) Now fetch/create the provisioning profile (private key is available)
      - name: Fetch provisioning profile from App Store Connect
        script: |
          set -euxo pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create
          # Apply the fetched profile to the Xcode project
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          set -euxo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          sed -i '' -E '1,/^version:/s/^version:.*/version: 0.1.1+'"$CM_BUILD_ID"'/' pubspec.yaml
          grep -n '^version:' pubspec.yaml
          plutil -p ios/Runner/Info.plist | grep CFBundleVersion || true

      # 🧪 Optional debug — keep it until we get one green build
      - name: Diagnose signing (debug)
        script: |
          set -euxo pipefail
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true
          xcodebuild -showBuildSettings \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$XCODE_SCHEME" | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN" || true

      - name: Build IPA
        script: |
          set -euxo pipefail
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
