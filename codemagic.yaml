workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64 .mobileprovision)
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY (.p8 incl. BEGIN/END), APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        TEAM_ID: 8Y7L4NZ5ZX
        BUNDLE_ID: com.decoywalletapp.app

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
          cd ios
          pod repo update
          pod install --repo-update
          cd ..

      - name: Initialize keychain & import Distribution .p12
        script: |
          set -euo pipefail
          keychain initialize
          # Decode the base64 .p12 from $CM_CERTIFICATE and import it
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile from env var
        script: |
          set -euo pipefail
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
          mkdir -p "$(dirname "$PROFILE_PATH")"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"
          # Optional: print profile name (helps debugging)
          /usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<<"$(security cms -D -i "$PROFILE_PATH")" || true

      - name: Point Xcode project to installed profile(s)
        script: |
          set -euo pipefail
          xcode-project use-profiles

      - name: Bump build number (numeric & monotonic)
        script: |
          set -euo pipefail
          BN="${CM_BUILD_NUMBER:-$(date -u +%Y%m%d%H%M)}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$BN/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA (Xcode)
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --workspace "$IOS_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

      - name: Verify IPA has embedded provisioning profile
        script: |
          set -euo pipefail
          ls -lah build/ios/ipa || true
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          unzip -l "$IPA" | grep -q 'embedded.mobileprovision'

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key:
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
