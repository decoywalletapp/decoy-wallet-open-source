workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert           # must contain: CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD
        - app_store_connect      # must contain: APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
    flutter: stable
    xcode: latest

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd -

      - name: Initialize keychain & import signing certificate (manual)
        script: |
          set -euxo pipefail
          # Create an isolated keychain
          keychain initialize
          keychain make-default

          # Decode your Distribution .p12 from CM_CERTIFICATE
          echo -n "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12

          # Get the default keychain path and trim quotes/whitespace
          KEYCHAIN_PATH="$(security default-keychain -d user | tr -d '\"' | xargs)"

          # Import the .p12 (Distribution) into the keychain
          security import /tmp/dist.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

      - name: Use provisioning profiles uploaded to Codemagic
        script: |
          # This tells Xcode to use the .mobileprovision files you uploaded under Teams > iOS provisioning profiles
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$CM_BUILD_ID/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key:
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
