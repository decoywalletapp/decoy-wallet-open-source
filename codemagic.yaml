workflows:
  ios_release:
    name: iOS Release (TestFlight)
    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE, CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (base64) or iOSProvisioningProfileSecret
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & restore dependencies
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install --repo-update
          cd ..

      - name: Initialize keychain & import p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"
          KEYCHAIN="$(security default-keychain -d user | tr -d '"')"
          echo "Default keychain: $KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" || true

      - name: Install provisioning profile from env var
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          if [ -n "${IOS_PROVISIONING_PROFILE:-}" ]; then
            echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          elif [ -n "${IOS_PROVISIONING_PROFILE_SECRET:-}" ]; then
            echo "$IOS_PROVISIONING_PROFILE_SECRET" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          elif [ -n "${iOSProvisioningProfileSecret:-}" ]; then
            echo "$iOSProvisioningProfileSecret" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          else
            echo "No provisioning profile env var found"; exit 1
          fi
          ls -lah "$PROFILE_DIR"

      - name: Point Xcode project to installed profile(s)
        script: |
          set -euxo pipefail
          xcode-project use-profiles --warn-only

      - name: Bump build number automatically (UTC timestamp)
        script: |
          set -euxo pipefail
          TS=$(date -u +"%Y%m%d%H%M")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TS" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:.*/s/^version:.*/version: 0.1.1+$TS/" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA (Flutter)
        script: |
          set -euxo pipefail
          flutter doctor -v || true
          flutter build ipa --release
          echo "==== After flutter build, top-level build/ tree ===="
          find build -maxdepth 3 -mindepth 1 -print | sed 's/^/  /' | head -n 200 || true

      - name: Ensure an IPA exists (auto-package if Flutter didn’t export)
        script: |
          set -euxo pipefail
          OUTDIR="build/ios/ipa"
          mkdir -p "$OUTDIR"

          # A) If Flutter already produced an .ipa anywhere under build/, use it
          IPA_FOUND="$(find build -type f -name '*.ipa' | head -n 1 || true)"
          if [ -n "$IPA_FOUND" ]; then
            echo "Found IPA at: $IPA_FOUND"
            cp "$IPA_FOUND" "$OUTDIR/Runner.ipa"
            ls -lah "$OUTDIR"
            exit 0
          fi

          # B) Otherwise try to package any device Runner.app we can find
          echo "No .ipa found; attempting to package Runner.app..."
          APP_PATH="$(find build -type d -name 'Runner.app' -path '*/iphoneos/*' -print -quit || true)"
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found. Dumping build tree for debugging:"
            find build -maxdepth 4 -print | sed 's/^/  /' | head -n 500 || true
            exit 1
          fi

          if [ ! -f "$APP_PATH/embedded.mobileprovision" ]; then
            echo "ERROR: embedded.mobileprovision missing inside Runner.app"; exit 1
          fi

          TMPDIR="$(mktemp -d)"
          mkdir -p "$TMPDIR/Payload"
          cp -R "$APP_PATH" "$TMPDIR/Payload/Runner.app"
          (cd "$TMPDIR" && zip -qry Runner.ipa Payload)
          mv "$TMPDIR/Runner.ipa" "$OUTDIR/Runner.ipa"
          rm -rf "$TMPDIR"
          ls -lah "$OUTDIR"

      - name: Verify IPA & embedded provisioning profile
        script: |
          set -euxo pipefail
          ls -lah build/ios/ipa
          IPA="build/ios/ipa/Runner.ipa"
          unzip -l "$IPA" | grep -q "embedded.mobileprovision" \
            || { echo "embedded.mobileprovision missing — aborting upload"; exit 1; }

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/Runner*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
