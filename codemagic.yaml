workflows:
  ios_release:
    name: iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: 16.4
      cocoapods: default
      vars:
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      # 👇 Make sure both groups exist in Codemagic > Environment variables
      groups:
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY, APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
        - signing_cert          # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Clean & get packages
        script: |
          set -euxo pipefail
          flutter --version
          flutter clean
          flutter pub get

      - name: Install CocoaPods
        script: |
          set -euxo pipefail
          cd ios
          pod install --repo-update
          cd ..

      - name: Fetch provisioning profiles from App Store Connect
        script: |
          set -euxo pipefail
          # Create/Fetch profiles for App Store distribution
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --key-id $APP_STORE_CONNECT_KEY_IDENTIFIER \
            --issuer-id $APP_STORE_CONNECT_ISSUER_ID \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --create

      - name: Import signing certificate(s) and apply profiles
        script: |
          set -euxo pipefail
          # Imports .p12 from the "signing_cert" group (or Code signing files UI)
          keychain add-certificates
          # Writes PROVISIONING_PROFILE_SPECIFIER, CODE_SIGNING settings to the project
          xcode-project use-profiles

      - name: Bump build number automatically
        script: |
          set -euxo pipefail
          # Use Codemagic build ID for CFBundleVersion to avoid "already used"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $CM_BUILD_ID" ios/Runner/Info.plist || true
          # Keep Flutter's pubspec in sync (marketing version stays 0.1.1)
          sed -i '' -E '1,/^version:/s/^version:.*/version: 0.1.1+'"$CM_BUILD_ID"'/' pubspec.yaml
          grep -n '^version:' pubspec.yaml
          plutil -p ios/Runner/Info.plist | grep CFBundleVersion || true

      # ---------- DEBUG HELP (safe to keep; remove if you want) ----------
      - name: Diagnose signing (debug)
        script: |
          set -euxo pipefail
          security find-identity -v -p codesigning || true
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles || true
          xcodebuild -showBuildSettings \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$XCODE_SCHEME" | grep -E "PRODUCT_BUNDLE_IDENTIFIER|PROVISIONING_PROFILE|CODE_SIGN" || true
      # -------------------------------------------------------------------

      - name: Build IPA
        script: |
          set -euxo pipefail
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY        # full .p8 text incl. header/footer
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER      # e.g. 989Y382263
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID        # the long UUID
        submit_to_testflight: true
        # (Do NOT set cancel_previous_submissions here—it's for App Store review, not TestFlight.)
