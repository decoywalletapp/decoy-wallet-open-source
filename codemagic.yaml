workflows:
  ios_release:
    name: iOS Release (TestFlight)

    environment:
      groups:
        - signing_cert          # CM_CERTIFICATE (base64 .p12), CM_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE, IOS_PROFILE_SPECIFIER (optional)
        - app_store_connect     # APP_STORE_CONNECT_PRIVATE_KEY (.p8 full text), APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID
      flutter: stable
      xcode: latest
      vars:
        TEAM_ID: 8Y7L4NZ5ZX
        BUNDLE_ID: com.decoywalletapp.app
        IOS_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner

    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ios/Pods

    scripts:
      - name: Flutter clean & deps
        script: |
          set -euxo pipefail
          flutter clean
          flutter pub get

      - name: Initialize keychain & import Distribution .p12
        script: |
          set -euxo pipefail
          keychain initialize
          echo "$CM_CERTIFICATE" | base64 --decode > /tmp/dist.p12
          keychain add-certificates --certificate /tmp/dist.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Install provisioning profile from env var
        script: |
          set -euxo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_DIR/appstore.mobileprovision"
          xcode-project use-profiles --warn-only

      - name: Bump build number (UTC timestamp)
        script: |
          set -euxo pipefail
          BN="$(date -u +%Y%m%d%H%M)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BN" ios/Runner/Info.plist
          sed -i '' -E "1,/^version:/{s/^version:.*/version: 0.1.1+$BN/}" pubspec.yaml
          grep -n '^version:' pubspec.yaml || true

      - name: Build IPA (Flutter)
        script: |
          set -euxo pipefail
          flutter build ipa --release

      - name: Ensure an IPA exists (fallback export from xcarchive)
        script: |
          set -euxo pipefail
          OUTDIR="build/ios/ipa"
          mkdir -p "$OUTDIR"

          if ! find build -type f -name '*.ipa' | head -n 1 >/dev/null 2>&1; then
            ARCHIVE="build/ios/archive/Runner.xcarchive"
            if [ -d "$ARCHIVE" ]; then
              PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.mobileprovision"
              security cms -D -i "$PROFILE_PATH" > /tmp/profile.plist || true
              SPECIFIER="$(
                /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist 2>/dev/null \
                || echo "${IOS_PROFILE_SPECIFIER:-}"
              )"

              cat > exportOptions.plist <<'PLIST'
              <?xml version="1.0" encoding="UTF-8"?>
              <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
              <plist version="1.0">
              <dict>
                <key>method</key><string>app-store</string>
                <key>signingStyle</key><string>manual</string>
                <key>teamID</key><string>__TEAM_ID__</string>
                <key>provisioningProfiles</key>
                <dict>
                  <key>__BUNDLE_ID__</key><string>__SPECIFIER__</string>
                </dict>
                <key>manageAppVersionAndBuildNumber</key><false/>
              </dict>
              </plist>
              PLIST

              sed -i '' \
                -e "s/__TEAM_ID__/${TEAM_ID}/" \
                -e "s#__BUNDLE_ID__#${BUNDLE_ID}#" \
                -e "s/__SPECIFIER__/${SPECIFIER}/" \
                exportOptions.plist

              xcodebuild -exportArchive \
                -archivePath "$ARCHIVE" \
                -exportPath "$OUTDIR" \
                -exportOptionsPlist exportOptions.plist
            fi
          fi

      - name: Verify IPA has embedded provisioning profile
        script: |
          set -euxo pipefail
          IPA="$(ls -1 build/ios/ipa/*.ipa | head -n1)"
          test -n "$IPA"
          unzip -l "$IPA" | grep -q 'embedded.mobileprovision'

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key:
          key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
          issuer_id: $APP_STORE_CONNECT_ISSUER_ID
          private_key: $APP_STORE_CONNECT_PRIVATE_KEY
        submit_to_testflight: true
        beta_groups:
          - DayZeroDecoyTesters
